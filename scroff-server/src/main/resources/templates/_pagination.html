<!--
  通用分页组件 fragment
  使用：
    <div th:replace="~{_pagination :: pager(page=${page}, baseUrl=${pagerBase})}"></div>

  所有属性都由 PagerHelper.prepare() 一次性注入，fragment 只做简单取值。
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="pager(page, baseUrl)">
<body>

<div class="pager" th:if="${page != null and page.totalPages > 1}">

    <!-- 左：统计信息。全部用 PagerHelper 预计算好的值，Thymeleaf 里零运算 -->
    <div class="pager-info">
        共 <b th:text="${page.totalElements}">0</b> 条，
        第 <b th:text="${page.number + 1}">1</b>/<b th:text="${page.totalPages}">1</b> 页
        <span class="pager-range" th:text="'（' + ${pagerRangeText} + '）'">（1-20）</span>
    </div>

    <!-- 中：页码按钮（所有 URL 由 Controller 预拼好） -->
    <div class="pager-buttons">

        <a class="pg-btn" th:href="${firstUrl}"
           th:classappend="${page.number == 0} ? 'pg-disabled'"
           aria-label="首页">«</a>

        <a class="pg-btn" th:if="${page.hasPrevious()}" th:href="${prevUrl}">‹</a>
        <span class="pg-btn pg-disabled" th:if="${!page.hasPrevious()}">‹</span>

        <!-- 首页按钮 -->
        <a class="pg-btn"
           th:classappend="${page.number == 0} ? 'pg-active'"
           th:href="${pagerPageUrls.get(0)}"
           th:text="1">1</a>

        <!-- 左省略号 -->
        <span class="pg-ellipsis" th:if="${pagerShowLeft}">…</span>

        <!-- 中间页码 -->
        <a class="pg-btn"
           th:each="p : ${pagerDisplay}"
           th:classappend="${p == page.number} ? 'pg-active'"
           th:href="${pagerPageUrls.get(p)}"
           th:text="${p + 1}">2</a>

        <!-- 右省略号 -->
        <span class="pg-ellipsis" th:if="${pagerShowRight}">…</span>

        <!-- 末页按钮 -->
        <a class="pg-btn"
           th:classappend="${page.number == page.totalPages - 1} ? 'pg-active'"
           th:href="${pagerPageUrls.get(page.totalPages - 1)}"
           th:text="${page.totalPages}">10</a>

        <a class="pg-btn" th:if="${page.hasNext()}" th:href="${nextUrl}">›</a>
        <span class="pg-btn pg-disabled" th:if="${!page.hasNext()}">›</span>

        <a class="pg-btn" th:href="${lastUrl}"
           th:classappend="${page.number == page.totalPages - 1} ? 'pg-disabled'"
           aria-label="末页">»</a>
    </div>

    <!-- 右：跳页表单。过滤条件从 PagerHelper 预准备好的 Map 拆成 hidden input。 -->
    <form class="pager-jump" th:action="${baseUrl}" method="get">
        <input type="hidden" th:each="p : ${pagerParams}"
               th:name="${p.key}" th:value="${p.value}"/>
        <label>跳至
            <input type="number" name="page" min="1"
                   th:max="${page.totalPages}"
                   th:attr="value=${page.number + 1}"
                   class="pg-jump-input"/>
            页
        </label>
        <button type="submit" class="btn btn-sm">Go</button>
    </form>
</div>

</body>
</html>
