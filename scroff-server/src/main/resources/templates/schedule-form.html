<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{_layout :: head(${schedule != null} ? '编辑定时' : '新建定时')}"></head>
<body>

<nav th:replace="~{_layout :: navbar('schedules')}"></nav>

<main class="container narrow">
    <h1 th:text="${schedule != null} ? '编辑定时任务' : '新建定时任务'">定时</h1>

    <form method="post"
          th:action="${schedule != null} ? @{'/schedules/' + ${schedule.id}} : @{/schedules}"
          th:object="${form}" class="form" id="scheduleForm">
        <div class="field">
            <label>名称 *</label>
            <input type="text" th:field="*{name}" required maxlength="100"
                   placeholder="例：早班开屏 / 晚班关屏 / 播放工能课视频">
            <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label>目标 *</label>
            <div class="radio-group">
                <label class="radio">
                    <input type="radio" name="targetAll" value="false"
                           th:checked="${form.targetAll == null or !form.targetAll}">
                    <span>指定设备</span>
                </label>
                <label class="radio">
                    <input type="radio" name="targetAll" value="true"
                           th:checked="${form.targetAll == true}">
                    <span>所有设备（同时控制多台）</span>
                </label>
            </div>
        </div>

        <!-- 指定设备模式：搜索式多选控件 -->
        <div class="field" id="deviceIdsField">
            <label>设备 *</label>

            <div class="multi-select">
                <!-- 已选设备 tag 展示 -->
                <div class="ms-tags" id="msTags"></div>

                <!-- 搜索框 -->
                <input type="text" id="msSearch" class="ms-search" placeholder="搜索设备名称或地址..." autocomplete="off">

                <!-- 下拉面板：checkbox 列表 -->
                <div class="ms-panel" id="msPanel" hidden>
                    <table style="width:100%;margin:0;border-collapse:collapse;">
                        <tbody id="msListBody"></tbody>
                    </table>
                </div>

                <!-- 隐藏 input：手动绑定 name/value，避免 th:field 覆盖显式 id -->
                <input type="hidden" name="deviceIds" th:value="${form.deviceIds}" id="deviceIdsHidden">
            </div>
            <small class="hint" id="msHint">支持搜索后勾选多台设备，点击 tag 上的 × 可移除</small>

            <!-- 设备校验按钮（仅 OPEN_FILE/OPEN_APP 时显示） -->
            <div id="validateWrap" style="display:none;margin-top:8px;">
                <button type="button" class="btn btn-sm" id="validateBtn">🔍 校验文件/应用存在性</button>
                <div id="validateResult" class="validate-result"></div>
            </div>

            <div class="err" th:if="${#fields.hasErrors('deviceIdsValidForScope')}" th:errors="*{deviceIdsValidForScope}"></div>
        </div>

        <div class="field">
            <label>动作 *</label>
            <select th:field="*{action}" id="actionSelect">
                <option value="OFF">关屏</option>
                <option value="ON">开屏</option>
                <option value="OPEN_FILE">打开文件</option>
                <option value="OPEN_APP">打开应用</option>
            </select>
        </div>

        <!-- 目标路径字段：仅 OPEN_FILE / OPEN_APP 时显示 -->
        <div class="field" id="targetPathField" style="display:none">
            <label id="targetPathLabel">目标 *</label>
            <div style="display:flex; gap:8px;">
                <input type="text" th:field="*{targetPath}" id="targetPathInput"
                       maxlength="500" style="flex:1"
                       placeholder="/sdcard/Movies/example.mp4">
                <button type="button" class="btn btn-primary" id="browseBtn" style="white-space:nowrap">浏览</button>
            </div>
            <small class="hint" id="targetPathHint"></small>
            <div class="err" th:if="${#fields.hasErrors('targetPath')}" th:errors="*{targetPath}"></div>
            <div class="err" th:if="${#fields.hasErrors('targetPathValidForAction')}" th:errors="*{targetPathValidForAction}"></div>
        </div>

        <div class="field">
            <label>Cron 表达式 *</label>
            <input type="text" id="cronInput" th:field="*{cron}" placeholder="0 50 7 * * *">
            <div class="cron-presets">
                <span class="hint-label">常用预设：</span>
                <button type="button" class="btn btn-sm preset-btn" data-cron="0 50 7 * * *">每天 7:50 开</button>
                <button type="button" class="btn btn-sm preset-btn" data-cron="0 50 17 * * *">每天 17:50 关</button>
                <button type="button" class="btn btn-sm preset-btn" data-cron="0 0 8 * * 1-5">工作日 8:00 开</button>
                <button type="button" class="btn btn-sm preset-btn" data-cron="0 0 18 * * 1-5">工作日 18:00 关</button>
                <button type="button" class="btn btn-sm preset-btn" data-cron="0 0 22 * * *">每天 22:00 关</button>
            </div>
            <small class="hint">
                6 段格式：<b>秒 分 时 日 月 周</b>。
                <code>0 50 7 * * *</code> = 每天 07:50
                &nbsp;·&nbsp;
                <code>0 50 17 * * *</code> = 每天 17:50
            </small>
            <div class="err" th:if="${#fields.hasErrors('cron')}" th:errors="*{cron}"></div>
        </div>

        <div class="field">
            <label class="checkbox">
                <input type="checkbox" th:field="*{enabled}"> 启用
            </label>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <a class="btn" href="/schedules">取消</a>
        </div>
    </form>
</main>

<!-- ========== 文件浏览 / 应用选择 模态框 ========== -->
<div id="browserModal" class="modal-overlay" hidden>
    <div class="modal-box">
        <h3 class="modal-title" id="browserTitle">浏览文件</h3>
        <div class="modal-message" id="browserContent">加载中...</div>
        <div class="modal-buttons">
            <button type="button" class="btn" id="browserRefreshBtn">刷新</button>
            <button type="button" class="btn btn-default" id="browserCancelBtn">取消</button>
        </div>
    </div>
</div>

<footer th:replace="~{_layout :: footer}"></footer>

<script th:inline="javascript">
    /* ========== 后端设备列表注入成 JS 变量 ========== */
    var ALL_DEVICES = /*[[${devices}]]*/ [];
    // ALL_DEVICES 元素形如 {id, name, address, enabled}
    // 初始选中 IDs（从 form.deviceIds hidden input 解析出来）
    var initialDeviceIds = (function() {
        var v = document.getElementById('deviceIdsHidden').value;
        if (!v) return [];
        return v.split(',').map(s => s.trim()).filter(Boolean).map(Number);
    })();

    /* ========== 目标模式切换 ========== */
    function updateTargetMode() {
        var allRadio = document.querySelector('input[name="targetAll"][value="true"]');
        var deviceField = document.getElementById('deviceIdsField');
        if (allRadio && allRadio.checked) {
            deviceField.style.display = 'none';
            // 清空隐藏 input
            document.getElementById('deviceIdsHidden').value = '';
        } else {
            deviceField.style.display = '';
        }
    }
    document.querySelectorAll('input[name="targetAll"]').forEach(function (r) {
        r.addEventListener('change', updateTargetMode);
    });
    updateTargetMode();

    /* ============ Cron 预设按钮：仅当输入框为空时才填入 ============ */
    document.querySelectorAll('.preset-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var cronInput = document.getElementById('cronInput');
            if (cronInput.value.trim() === '') {
                cronInput.value = btn.getAttribute('data-cron');
                cronInput.focus();
            } else {
                // 已有值：给个轻量提示，不覆盖
                btn.style.opacity = '0.5';
                setTimeout(function () { btn.style.opacity = ''; }, 300);
            }
        });
    });

    /* ============ 多选控件逻辑 ============ */
    var MultiSelect = (function () {
        var selectedIds = new Set(initialDeviceIds);
        var tagsEl = document.getElementById('msTags');
        var searchEl = document.getElementById('msSearch');
        var panelEl = document.getElementById('msPanel');
        var bodyEl = document.getElementById('msListBody');
        var hiddenEl = document.getElementById('deviceIdsHidden');

        function renderTags() {
            tagsEl.innerHTML = '';
            if (selectedIds.size === 0) return;
            var orderArr = Array.from(selectedIds); // 保持插入顺序的数组
            var sortedDevices = ALL_DEVICES.filter(function(d){ return selectedIds.has(d.id); })
                                          .sort(function(a,b){ return orderArr.indexOf(a.id) - orderArr.indexOf(b.id); });
            sortedDevices.forEach(function (d) {
                var tag = document.createElement('span');
                tag.className = 'ms-tag';
                tag.innerHTML = '<span class="ms-tag-label">' + escapeHtml(d.name) + ' <span class="ms-sub">' + escapeHtml(d.address) + '</span></span>'
                               + '<span class="ms-tag-x" data-id="' + d.id + '">×</span>';
                tagsEl.appendChild(tag);
            });
            // 绑定 × 点击
            tagsEl.querySelectorAll('.ms-tag-x').forEach(function (x) {
                x.addEventListener('click', function () {
                    selectedIds.delete(Number(x.getAttribute('data-id')));
                    syncHidden();
                    renderTags();
                    renderList();
                });
            });
        }

        function renderList() {
            var kw = searchEl.value.toLowerCase().trim();
            var html = '';
            var anyShown = false;
            ALL_DEVICES.forEach(function (d) {
                var match = !kw
                    || (d.name && d.name.toLowerCase().indexOf(kw) >= 0)
                    || (d.address && d.address.toLowerCase().indexOf(kw) >= 0);
                if (!match) return;
                anyShown = true;
                var checked = selectedIds.has(d.id);
                var enabled = d.enabled !== false; // null 视为 true
                var cls = 'ms-row' + (checked ? ' ms-checked' : '') + (enabled ? '' : ' ms-disabled');
                html += '<tr class="' + cls + '" data-id="' + d.id + '">'
                      + '<td style="width:24px;"><input type="checkbox" '
                      + (checked ? 'checked' : '')
                      + (enabled ? '' : ' disabled')
                      + ' class="ms-cb"></td>'
                      + '<td><div class="ms-row-main">'
                      + '<div class="ms-row-name">' + escapeHtml(d.name)
                      + '<span class="ms-sub">(' + escapeHtml(d.address) + ')</span></div>'
                      + (enabled ? '' : '<div class="ms-disabled-hint">已禁用</div>')
                      + '</div></td>'
                      + '</tr>';
            });
            if (!anyShown) {
                html = '<tr><td colspan="2" style="padding:10px;color:#999;text-align:center;">无匹配设备</td></tr>';
            }
            bodyEl.innerHTML = html;

            bodyEl.querySelectorAll('.ms-cb').forEach(function (cb) {
                cb.addEventListener('change', function () {
                    var row = cb.closest('.ms-row');
                    var id = Number(row.getAttribute('data-id'));
                    if (cb.checked) selectedIds.add(id);
                    else selectedIds.delete(id);
                    syncHidden();
                    renderTags();
                    renderList();
                });
            });
            // 整行点击也 toggle（checkbox 本身也能点）
            bodyEl.querySelectorAll('.ms-row').forEach(function (row) {
                row.addEventListener('click', function (e) {
                    if (e.target.tagName === 'INPUT') return;
                    var cb = row.querySelector('.ms-cb');
                    if (!cb.disabled) {
                        cb.checked = !cb.checked;
                        cb.dispatchEvent(new Event('change'));
                    }
                });
            });
        }

        function syncHidden() {
            hiddenEl.value = Array.from(selectedIds).join(',');
        }

        function openPanel() {
            renderList();
            panelEl.hidden = false;
        }
        function closePanel() {
            panelEl.hidden = true;
        }
        function togglePanel() {
            if (panelEl.hidden) openPanel(); else closePanel();
        }

        searchEl.addEventListener('focus', openPanel);
        searchEl.addEventListener('input', renderList);
        // 点别处关闭
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.multi-select')) closePanel();
        });

        renderTags();

        return {
            getSelected: function () { return Array.from(selectedIds); },
            getFirst: function () { var arr = Array.from(selectedIds); return arr.length > 0 ? arr[0] : null; },
            syncHidden: syncHidden
        };
    })();

    /* ============ 动作切换 ============ */
    function updateActionField() {
        var sel = document.getElementById('actionSelect');
        var action = sel ? sel.value : '';
        var pathField = document.getElementById('targetPathField');
        var pathLabel = document.getElementById('targetPathLabel');
        var pathHint = document.getElementById('targetPathHint');
        var browseBtn = document.getElementById('browseBtn');
        var validateWrap = document.getElementById('validateWrap');
        var browseTitle = document.getElementById('browserTitle');

        if (action === 'OPEN_FILE') {
            pathField.style.display = '';
            pathLabel.textContent = '文件路径 *';
            pathHint.textContent = 'Android 设备上的文件路径，如 /sdcard/Movies/demo.mp4。支持视频 / 图片 / 文档等。';
            browseBtn.textContent = '浏览文件';
            browseTitle.textContent = '浏览设备文件';
            validateWrap.style.display = '';
        } else if (action === 'OPEN_APP') {
            pathField.style.display = '';
            pathLabel.textContent = '应用包名或 Component *';
            pathHint.textContent = '如 com.example.app 或 com.example.app/.MainActivity。';
            browseBtn.textContent = '浏览应用';
            browseTitle.textContent = '选择已安装应用';
            validateWrap.style.display = '';
        } else {
            pathField.style.display = 'none';
            validateWrap.style.display = 'none';
        }
    }
    document.getElementById('actionSelect').addEventListener('change', updateActionField);
    updateActionField();

    /* ============ 浏览模态框 ============ */
    var browserModal = document.getElementById('browserModal');
    var browserContent = document.getElementById('browserContent');
    var browserRefreshBtn = document.getElementById('browserRefreshBtn');
    var browserCancelBtn = document.getElementById('browserCancelBtn');
    var currentActionMode = 'OPEN_FILE';
    var currentBrowsePath = '/sdcard';

    function getFirstSelectedDeviceId(allowAllMode) {
        var allRadio = document.querySelector('input[name="targetAll"][value="true"]');
        if (allRadio && allRadio.checked) {
            if (allowAllMode) return null;
            alert('浏览功能需要先指定一台设备。请切换到"指定设备"模式并勾选设备后再浏览。');
            return null;
        }
        var firstId = MultiSelect.getFirst();
        if (!firstId) {
            alert('请先勾选至少一台设备');
            return null;
        }
        return firstId;
    }

    function openBrowser() {
        var sel = document.getElementById('actionSelect');
        currentActionMode = sel.value;
        var deviceId = getFirstSelectedDeviceId(false);
        if (!deviceId) return;

        browserModal.hidden = false;
        if (currentActionMode === 'OPEN_APP') {
            loadPackages(deviceId);
        } else {
            var existing = document.getElementById('targetPathInput').value;
            currentBrowsePath = extractDir(existing) || '/sdcard';
            loadDir(deviceId, currentBrowsePath);
        }
    }

    function closeBrowser() { browserModal.hidden = true; }
    browserModal.addEventListener('click', function (e) { if (e.target === browserModal) closeBrowser(); });
    browserCancelBtn.addEventListener('click', closeBrowser);
    browserRefreshBtn.addEventListener('click', function () {
        var deviceId = MultiSelect.getFirst();
        if (deviceId) {
            if (currentActionMode === 'OPEN_APP') loadPackages(deviceId);
            else loadDir(deviceId, currentBrowsePath);
        }
    });

    function extractDir(p) {
        if (!p) return null;
        var idx = p.lastIndexOf('/');
        if (idx <= 0) return '/sdcard';
        return p.substring(0, idx) || '/';
    }

    function loadDir(deviceId, path) {
        currentBrowsePath = path;
        browserContent.innerHTML = '<div class="muted">加载中...</div>';
        fetch('/api/devices/' + deviceId + '/browse?path=' + encodeURIComponent(path))
            .then(function(r){ return r.json(); })
            .then(function(data){ renderFileBrowser(data, deviceId); })
            .catch(function(e){ browserContent.innerHTML = '<div class="err">加载失败: ' + e.message + '</div>'; });
    }

    function renderFileBrowser(data, deviceId) {
        if (!data.ok) { browserContent.innerHTML = '<div class="err">' + (data.error || '未知错误') + '</div>'; return; }
        var html = '<div style="margin-bottom:10px;font-size:13px;color:#666;">'
                 + '<strong>当前：</strong>' + escapeHtml(data.path) + ' → ';
        if (data.parentPath && data.parentPath !== data.path) {
            html += '<a href="javascript:void(0)" data-path="' + escapeHtmlAttr(data.parentPath) + '" class="nav-up">↑ 上一级</a>';
        }
        html += '</div>';
        if (!data.entries || data.entries.length === 0) {
            html += '<div class="muted" style="text-align:center;padding:30px;">目录为空</div>';
        } else {
            html += '<table><thead><tr><th style="width:24px"></th><th>名称</th><th style="width:80px">类型</th></tr></thead><tbody>';
            data.entries.forEach(function (e) {
                var icon = e.isDir ? '📁' : getFileIcon(e.extension);
                var rowClass = e.isDir ? ' dir-row' : ' file-row';
                html += '<tr class="' + rowClass + '" data-name="' + escapeHtmlAttr(e.name) + '">'
                      + '<td>' + icon + '</td>'
                      + '<td>' + escapeHtml(e.name) + '</td>'
                      + '<td class="muted">' + (e.isDir ? '目录' : (e.extension || '-')) + '</td></tr>';
            });
            html += '</tbody></table>';
        }
        browserContent.innerHTML = html;
        browserContent.querySelectorAll('.nav-up').forEach(function (a) {
            a.addEventListener('click', function () { loadDir(deviceId, a.getAttribute('data-path')); });
        });
        browserContent.querySelectorAll('.dir-row').forEach(function (row) {
            row.style.cursor = 'pointer';
            row.addEventListener('click', function () {
                var name = row.getAttribute('data-name');
                loadDir(deviceId, (currentBrowsePath === '/' ? '/' : currentBrowsePath + '/') + name);
            });
        });
        browserContent.querySelectorAll('.file-row').forEach(function (row) {
            row.style.cursor = 'pointer';
            row.addEventListener('click', function () {
                var name = row.getAttribute('data-name');
                document.getElementById('targetPathInput').value = (currentBrowsePath === '/' ? '/' : currentBrowsePath + '/') + name;
                closeBrowser();
            });
        });
    }

    function getFileIcon(ext) {
        if (!ext) return '📄';
        ext = ext.toLowerCase();
        if (['mp4','3gp','mkv','avi','mov','wmv','ts'].includes(ext)) return '🎬';
        if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) return '🖼️';
        if (['mp3','wav','flac','aac'].includes(ext)) return '🎵';
        if (['pdf'].includes(ext)) return '📕';
        return '📄';
    }

    function loadPackages(deviceId) {
        browserContent.innerHTML = '<div class="muted">加载中...</div>';
        fetch('/api/devices/' + deviceId + '/packages')
            .then(function(r){ return r.json(); })
            .then(function(data){ renderPackageList(data); })
            .catch(function(e){ browserContent.innerHTML = '<div class="err">加载失败: ' + e.message + '</div>'; });
    }

    function renderPackageList(data) {
        if (!data.ok) { browserContent.innerHTML = '<div class="err">' + (data.error || '未知错误') + '</div>'; return; }
        var pkgs = data.packages || [];
        var html = '<div style="margin-bottom:10px;">'
                 + '<input type="text" id="pkgSearch" placeholder="输入包名过滤..." '
                 + 'style="width:100%;padding:6px 10px;border:1px solid var(--c-border);border-radius:4px;font-size:13px;">'
                 + '</div>'
                 + '<table><thead><tr><th>包名</th></tr></thead><tbody id="pkgListBody">';
        pkgs.forEach(function (p) {
            html += '<tr class="pkg-row" data-pkg="' + escapeHtmlAttr(p.package) + '">'
                  + '<td style="cursor:pointer;">📦 ' + escapeHtml(p.package) + '</td></tr>';
        });
        html += '</tbody></table>';
        browserContent.innerHTML = html;
        var search = document.getElementById('pkgSearch');
        search.focus();
        search.addEventListener('input', function () {
            var kw = search.value.toLowerCase();
            browserContent.querySelectorAll('.pkg-row').forEach(function (r) {
                r.style.display = r.getAttribute('data-pkg').toLowerCase().indexOf(kw) >= 0 ? '' : 'none';
            });
        });
        browserContent.querySelectorAll('.pkg-row').forEach(function (row) {
            row.style.cursor = 'pointer';
            row.addEventListener('click', function () {
                document.getElementById('targetPathInput').value = row.getAttribute('data-pkg');
                closeBrowser();
            });
        });
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>]/g, function (c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];
        });
    }
    function escapeHtmlAttr(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"]/g, function (c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
        });
    }

    /* ============ 浏览按钮 & 校验按钮 ============ */
    document.getElementById('browseBtn').addEventListener('click', openBrowser);

    document.getElementById('validateBtn').addEventListener('click', function () {
        var deviceIds = MultiSelect.getSelected();
        var action = document.getElementById('actionSelect').value;
        var targetPath = document.getElementById('targetPathInput').value.trim();
        if (deviceIds.length === 0) { alert('请先勾选设备'); return; }
        if (!targetPath) { alert('请先填写目标路径'); return; }
        if (action !== 'OPEN_FILE' && action !== 'OPEN_APP') {
            alert('只有"打开文件/打开应用"动作才需要校验'); return;
        }
        var resultEl = document.getElementById('validateResult');
        resultEl.innerHTML = '<div class="muted">校验中（' + deviceIds.length + ' 台）...</div>';

        fetch('/api/devices/validate-target', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                deviceIds: deviceIds,
                targetPath: targetPath,
                action: action
            })
        }).then(function(r){ return r.json(); })
          .then(function(data){ renderValidateResult(data, resultEl); })
          .catch(function(e){ resultEl.innerHTML = '<div class="err">校验请求失败: ' + e.message + '</div>'; });
    });

    function renderValidateResult(data, el) {
        if (!data.ok) { el.innerHTML = '<div class="err">' + (data.error || '未知错误') + '</div>'; return; }
        var summary = data.summary || '';
        var html = '<div class="validate-summary">' + escapeHtml(summary) + '</div>';
        html += '<table style="width:100%;margin-top:6px;border-collapse:collapse;font-size:13px;">'
              + '<thead><tr style="background:#f8fafc;"><th style="padding:6px 8px;text-align:left;">设备</th>'
              + '<th style="padding:6px 8px;text-align:left;">在线</th>'
              + '<th style="padding:6px 8px;text-align:left;">存在</th>'
              + '<th style="padding:6px 8px;text-align:left;">详情</th></tr></thead><tbody>';
        data.results.forEach(function (r) {
            var onlineTag = r.online ? '<span class="tag tag-ok">在线</span>' : '<span class="tag tag-offline">离线</span>';
            var existsTag = r.exists ? '<span class="tag tag-ok">通过</span>' : '<span class="tag tag-err">不通过</span>';
            html += '<tr>'
                  + '<td style="padding:6px 8px;">' + escapeHtml(r.deviceName) + '</td>'
                  + '<td style="padding:6px 8px;">' + onlineTag + '</td>'
                  + '<td style="padding:6px 8px;">' + existsTag + '</td>'
                  + '<td style="padding:6px 8px;color:#666;">' + escapeHtml(r.detail || '') + '</td>'
                  + '</tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }
</script>
</body>
</html>
